<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Мы временно закрыты :(</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #0f0c29; /* тёмный градиент */
      overflow: hidden;
      font-family: 'Segoe UI', Roboto, Arial, sans-serif;
    }

    .container {
      text-align: center;
      position: relative;
      z-index: 10;
    }

    /* Анимация появления текста */
    .animated-text {
      color: #fff;
      font-size: 3rem;
      font-weight: 700;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.5s;
      text-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Пульсация грустного смайлика */
    .sad-face {
      display: inline-block;
      animation: pulse 2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    /* Декоративные частицы/точки вокруг текста */
    .dot {
      position: absolute;
      width: 6px;
      height: 6px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      filter: drop-shadow(0 0 8px rgba(255,255,255,0.8));
      animation-name: float;
      animation-duration: 4s;
      animation-iteration-count: infinite;
      animation-timing-function: ease-in-out;
      opacity: 0;
    }

    .dot-1 { top: -40px; left: -20px; animation-delay: 0s; }
    .dot-2 { top: 60px; right: -30px; animation-delay: 0.7s; }
    .dot-3 { bottom: -50px; left: 10px; animation-delay: 1.4s; }
    .dot-4 { bottom: 20px; right: 20px; animation-delay: 2.1s; }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(0.8);
        opacity: 0.3;
      }
      50% {
        transform: translateY(-20px) scale(1.2);
        opacity: 0.9;
      }
    }

    /* Дополнительная анимация: мерцание фона */
    .bg-pulse {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: radial-gradient(circle at 50% 50%, #302b63 0%, #0f0c29 100%);
      z-index: -1;
      animation: bgGlow 8s infinite alternate;
    }

    @keyframes bgGlow {
      from { filter: brightness(0.95); }
      to { filter: brightness(1.05); }
    }
  </style>
</head>
<body>
  <div class="bg-pulse"></div>

  <div class="container">
    <!-- Точки-частицы -->
    <div class="dot dot-1"></div>
    <div class="dot dot-2"></div>
    <div class="dot dot-3"></div>
    <div class="dot dot-4"></div>

    <h1 class="animated-text">Мы временно закрыты <span class="sad-face">:(</span></h1>
  </div>
</body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>БРЕНЛЕНД — Пятый</title>
  <style>
    :root {
      --bg: #000000;
      --text: #cccccc;
      --accent: #4a4a4a;
      --red: #ff0000;
      --transition: 0.3s ease;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Courier New', monospace;
      background: #000;
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }

    .container {
      width: min(800px, 95%);
      margin: 0 auto;
      padding: 30px 20px;
      text-align: center;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: fadeOut 0.5s ease 1s forwards;
    }

    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }

    .loading-text {
      font-size: 1.5rem;
      color: #555;
      letter-spacing: 0.5em;
      animation: loadingPulse 1s ease-in-out infinite;
    }

    @keyframes loadingPulse {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    /* 3D анимация оверлей */
    .animation-overlay {
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }

    .animation-overlay.open {
      display: flex;
      animation: overlayIn 0.3s ease;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .animation-close-btn {
      position: absolute;
      top: 20px;
      right: 30px;
      background: #1a1a1a;
      border: 2px solid #444;
      color: #ccc;
      padding: 10px 20px;
      border-radius: 25px;
      font-family: 'Courier New', monospace;
      font-size: 1rem;
      cursor: pointer;
      z-index: 2001;
    }

    .animation-close-btn:hover {
      background: #333;
    }

    .animation-scene {
      width: 90%;
      height: 70%;
      position: relative;
      perspective: 800px;
      background: linear-gradient(180deg, #0a0a2a 0%, #1a0a0a 50%, #0a0a0a 100%);
      border: 2px solid #333;
      border-radius: 20px;
      overflow: hidden;
    }

    .animation-title {
      font-size: 1.5rem;
      color: #ff0000;
      margin-bottom: 20px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(255,0,0,0.8);
    }

    /* Город */
    .city-building {
      position: absolute;
      bottom: 0;
      width: 8%;
      background: #111;
      border: 1px solid #333;
      transition: all 0.5s;
    }

    /* Персонажи */
    .fighter {
      position: absolute;
      width: 50px;
      height: 80px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      color: #fff;
      font-weight: bold;
      text-shadow: 0 0 10px currentColor;
      transition: all 0.8s cubic-bezier(0.2, 0.9, 0.3, 1);
      z-index: 10;
    }

    .fighter.pjaty {
      background: linear-gradient(180deg, #3a3a3a, #0a0a0a);
      border: 3px solid #ff0000;
      box-shadow: 0 0 40px rgba(255,0,0,0.8);
      width: 70px;
      height: 120px;
      font-size: 0.9rem;
      z-index: 20;
    }

    .fighter.pjaty.ultimate {
      background: linear-gradient(180deg, #5a1010, #1a0505);
      box-shadow: 0 0 100px rgba(255,0,0,1);
      width: 100px;
      height: 150px;
      font-size: 1.2rem;
    }

    .sword {
      position: absolute;
      width: 4px;
      height: 50px;
      background: #ff0000;
      box-shadow: 0 0 30px #ff0000;
      transform-origin: bottom center;
      transition: all 0.3s;
    }

    .sword.swing {
      transform: rotate(120deg);
      box-shadow: 0 0 60px #ff0000, 0 0 120px #ff6600;
    }

    .explosion {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(circle, #ff0000, #ff6600, transparent);
      animation: explodeAnim 1s ease forwards;
      z-index: 30;
    }

    @keyframes explodeAnim {
      0% { transform: scale(0); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    .slash-effect {
      position: absolute;
      width: 100px;
      height: 100px;
      border: 3px solid #ff0000;
      border-radius: 50%;
      clip-path: polygon(50% 50%, 100% 0, 100% 100%);
      animation: slashAnim 0.5s ease forwards;
      z-index: 25;
    }

    @keyframes slashAnim {
      0% { transform: rotate(0deg) scale(0); opacity: 1; }
      100% { transform: rotate(180deg) scale(2); opacity: 0; }
    }

    /* Лицо Пятого */
    .character-container {
      position: relative;
      margin: 0 auto 30px;
      width: 200px;
      height: 200px;
    }

    .character {
      position: relative;
      width: 100%;
      height: 100%;
    }

    .character.angry {
      animation: angryShake 0.3s ease-in-out infinite;
    }

    @keyframes angryShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .face {
      width: 150px;
      height: 150px;
      background: radial-gradient(circle at 50% 40%, #2a2a2a, #0a0a0a);
      border-radius: 50%;
      margin: 0 auto;
      position: relative;
      border: 3px solid #444;
      transition: all var(--transition);
      box-shadow: 0 0 40px rgba(60, 60, 60, 0.5);
    }

    .character.angry .face {
      background: radial-gradient(circle at 50% 40%, #3a0a0a, #1a0505);
      border-color: #ff3333;
      box-shadow: 0 0 60px rgba(255, 0, 0, 0.7);
    }

    .eyes {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 25px;
    }

    .eye {
      width: 15px;
      height: 15px;
      background: #fff;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.6);
    }

    .character.angry .eye {
      background: #ff0000;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.9);
      width: 16px;
      height: 10px;
      border-radius: 2px;
    }

    .mouth {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 35px;
      height: 8px;
      background: #555;
      border-radius: 50%;
    }

    .character.angry .mouth {
      width: 30px;
      height: 15px;
      background: #ff0000;
      border-radius: 0;
    }

    .character-name {
      font-size: 1.3rem;
      font-weight: bold;
      color: #aaa;
      margin-top: 10px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    .speech-bubble {
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 15px;
      padding: 20px;
      margin: 20px auto;
      max-width: 500px;
      text-align: left;
      min-height: 60px;
    }

    .speech-bubble.angry {
      border-color: #ff3333;
      background: #1a0505;
      box-shadow: 0 0 30px rgba(255, 0, 0, 0.5);
    }

    .character-response {
      font-size: 1rem;
      color: #ddd;
      min-height: 30px;
    }

    .chat-history {
      background: rgba(15, 15, 15, 0.8);
      border: 1px solid #333;
      border-radius: 10px;
      padding: 15px;
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
      text-align: left;
      font-size: 0.85rem;
    }

    .history-message {
      margin-bottom: 8px;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .input-container {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }

    .chat-input {
      flex: 1;
      padding: 12px 18px;
      background: #111;
      border: 2px solid #333;
      border-radius: 25px;
      color: #ccc;
      font-family: 'Courier New', monospace;
      font-size: 0.9rem;
    }

    .chat-input:focus {
      outline: none;
      border-color: #555;
    }

    .send-btn {
      padding: 12px 22px;
      background: #1a1a1a;
      border: 2px solid #444;
      border-radius: 25px;
      color: #ccc;
      font-family: 'Courier New', monospace;
      cursor: pointer;
    }

    .send-btn:hover {
      background: #333;
    }

    .hint-text {
      color: #333;
      font-size: 0.7rem;
      margin-top: 10px;
    }

    .title {
      font-size: 1.8rem;
      color: #666;
      margin-bottom: 20px;
      letter-spacing: 0.4em;
    }
  </style>
</head>
<body>
  <div class="loading-overlay">
    <div class="loading-text">ЗАГРУЗКА...</div>
  </div>

  <!-- 3D анимация -->
  <div class="animation-overlay" id="animationOverlay">
    <button class="animation-close-btn" onclick="closeAnimation()">✕ Закрыть</button>
    <div class="animation-title" id="animationTitle"></div>
    <div class="animation-scene" id="animationScene"></div>
  </div>

  <div class="container">
    <h1 class="title">БРЕНЛЕНД</h1>

    <div class="character-container">
      <div class="character" id="character">
        <div class="face">
          <div class="eyes">
            <div class="eye"></div>
            <div class="eye"></div>
          </div>
          <div class="mouth"></div>
        </div>
      </div>
      <div class="character-name" id="characterName">Пятый</div>
    </div>

    <div class="speech-bubble" id="speechBubble">
      <div class="character-response" id="characterResponse">Приветствую...</div>
    </div>

    <div class="input-container">
      <input type="text" class="chat-input" id="chatInput" placeholder="Спроси Пятого..." onkeypress="if(event.key === 'Enter') sendMessage()">
      <button class="send-btn" onclick="sendMessage()">Спросить</button>
    </div>

    <div class="hint-text">Спроси про: симуляцию, лор, скайбокс, игроков</div>
    <div class="chat-history" id="chatHistory"></div>
  </div>

  <script>
    (function() {
      const character = document.getElementById('character');
      const characterName = document.getElementById('characterName');
      const speechBubble = document.getElementById('speechBubble');
      const characterResponse = document.getElementById('characterResponse');
      const chatInput = document.getElementById('chatInput');
      const chatHistory = document.getElementById('chatHistory');
      const animationOverlay = document.getElementById('animationOverlay');
      const animationScene = document.getElementById('animationScene');
      const animationTitle = document.getElementById('animationTitle');

      let isAngry = false;
      let animationActive = false;

      // База знаний
      const knowledge = {
        'симуляция': { keywords: ['симуляц', 'симуляция', 'реальность'], response: 'Бренленд — это симуляция. Я — полубог этой симуляции.', angry: false },
        'скайбокс': { keywords: ['скайбокс', 'небо', 'купол'], response: 'Скайбокс — граница симуляции. За ним — пустота.', angry: false },
        'создатель': { keywords: ['создатель', 'ксиодер', 'xsioder'], response: 'Xsioder — создатель симуляции. Грибы Грибочки!', angry: false },
        'тех админ': { keywords: ['тех', 'админ', 'avrairut'], response: 'AvraiRut — хранитель кода симуляции.', angry: false },
        'привет': { keywords: ['привет', 'здравствуй'], response: 'Здравствуй, путник. Что хочешь узнать?', angry: false },
        'кто ты': { keywords: ['кто ты'], response: 'Я — Пятый, полубог симуляции.', angry: false },
        'игроки': { keywords: ['игроки'], response: 'Избранные: Xsioder, AvraiRut, FunDreamer, Flanalla, Vova, Abibek, Bounty.', angry: false }
      };

      const insultWords = ['дурак', 'тупой', 'идиот', 'ненавижу', 'заткнись', 'бесишь'];

      function getResponse(input) {
        const lower = input.toLowerCase();
        if (insultWords.some(w => lower.includes(w))) {
          return { text: 'Ты смеешь оскорблять полубога?!', angry: true };
        }
        for (const [key, data] of Object.entries(knowledge)) {
          if (data.keywords.some(k => lower.includes(k))) return { text: data.response, angry: data.angry };
        }
        return { text: 'Спроси о симуляции, лоре или игроках.', angry: false };
      }

      function playSound(file) {
        const audio = new Audio(file);
        audio.volume = 0.6;
        audio.play().catch(() => {});
      }

      function addHistory(text, type, angry = false) {
        const div = document.createElement('div');
        div.className = 'history-message';
        div.style.cssText = type === 'user' 
          ? 'background:#111;color:#777;border:1px solid #222;'
          : angry 
            ? 'background:#1a0505;color:#ff6666;border:1px solid #ff3333;'
            : 'background:#1a1a1a;color:#999;border:1px solid #333;';
        div.textContent = (type === 'user' ? 'Вы: ' : 'Пятый: ') + text;
        chatHistory.appendChild(div);
        chatHistory.scrollTop = chatHistory.scrollHeight;
      }

      function setAngry(angry) {
        if (isAngry === angry) return;
        isAngry = angry;
        if (angry) {
          character.classList.add('angry');
          characterName.textContent = 'ПЯТЫЙ (РАЗДРАЖЁН)';
          speechBubble.classList.add('angry');
          playSound('glitch.mp3');
        } else {
          character.classList.remove('angry');
          characterName.textContent = 'Пятый';
          speechBubble.classList.remove('angry');
        }
      }

      function typewriter(text, angry, callback) {
        characterResponse.textContent = '';
        const words = text.split(' ');
        let i = 0;
        function next() {
          if (i < words.length) {
            characterResponse.textContent += (i > 0 ? ' ' : '') + words[i];
            playSound('say.wav');
            i++;
            setTimeout(next, 150);
          } else if (callback) callback();
        }
        next();
      }

      window.sendMessage = function() {
        const input = chatInput.value.trim();
        if (!input || animationActive) return;
        addHistory(input, 'user');
        chatInput.value = '';
        const resp = getResponse(input);
        setTimeout(() => {
          if (resp.angry) {
            setAngry(true);
            typewriter(resp.text, true, () => {
              addHistory(resp.text, 'character', true);
              setTimeout(() => setAngry(false), 3000);
            });
          } else {
            setAngry(false);
            typewriter(resp.text, false, () => addHistory(resp.text, 'character'));
          }
        }, 300);
      };

      // 3D анимации
      function createCity(scene) {
        for (let i = 0; i < 12; i++) {
          const building = document.createElement('div');
          building.className = 'city-building';
          building.style.left = (i * 8) + '%';
          building.style.height = (20 + Math.random() * 40) + '%';
          building.style.transform = 'translateZ(-30px)';
          scene.appendChild(building);
        }
      }

      function createFighter(name, color, x, y) {
        const el = document.createElement('div');
        el.className = 'fighter';
        el.style.left = x + '%';
        el.style.top = y + '%';
        el.style.background = `linear-gradient(180deg, ${color}, #0a0a0a)`;
        el.style.border = `2px solid ${color}`;
        el.style.color = color;
        el.textContent = name;
        return el;
      }

      function createExplosion(x, y) {
        const exp = document.createElement('div');
        exp.className = 'explosion';
        exp.style.left = x + '%';
        exp.style.top = y + '%';
        return exp;
      }

      function showKillAnimation() {
        animationActive = true;
        animationOverlay.classList.add('open');
        animationTitle.textContent = 'ПЯТЫЙ УНИЧТОЖАЕТ XSIODER';
        animationScene.innerHTML = '';
        createCity(animationScene);

        const pjaty = createFighter('ПЯТЫЙ', '#ff0000', 20, 40);
        pjaty.classList.add('pjaty');
        const xsioder = createFighter('XSIODER', '#ff6b2b', 60, 40);

        animationScene.appendChild(pjaty);
        animationScene.appendChild(xsioder);

        // Движение Пятого
        setTimeout(() => {
          pjaty.style.left = '45%';
          pjaty.style.transform = 'translateZ(60px)';
          playSound('glitch.mp3');
        }, 500);

        // Атака
        setTimeout(() => {
          const slash = document.createElement('div');
          slash.className = 'slash-effect';
          slash.style.left = '50%';
          slash.style.top = '30%';
          animationScene.appendChild(slash);
          playSound('say.wav');
        }, 1500);

        // Уничтожение Xsioder
        setTimeout(() => {
          xsioder.style.opacity = '0';
          xsioder.style.transform = 'rotate(90deg) translateZ(-50px)';
          animationScene.appendChild(createExplosion(55, 30));
          playSound('glitch.mp3');
        }, 2500);

        // Финал
        setTimeout(() => {
          pjaty.classList.add('ultimate');
          pjaty.style.left = '40%';
        }, 3500);
      }

      function showBattleAnimation() {
        animationActive = true;
        animationOverlay.classList.add('open');
        animationTitle.textContent = 'БИТВА: ПЯТЫЙ ПРОТИВ ВСЕХ';
        animationScene.innerHTML = '';
        createCity(animationScene);

        const pjaty = createFighter('ПЯТЫЙ', '#ff0000', 70, 30);
        pjaty.classList.add('pjaty');
        animationScene.appendChild(pjaty);

        const fighters = [
          { name: 'AVRAIRUT', color: '#a855f7', x: 10 },
          { name: 'FUNDREAMER', color: '#22c55e', x: 20 },
          { name: 'FLANALLA', color: '#6b21a8', x: 30 },
          { name: 'ABIBEK', color: '#15803d', x: 40 },
          { name: 'BOUNTY', color: '#3b82f6', x: 50 }
        ];

        fighters.forEach((f, i) => {
          const fighter = createFighter(f.name, f.color, f.x, 45);
          animationScene.appendChild(fighter);

          // Атака на Пятого
          setTimeout(() => {
            fighter.style.left = (f.x + 15) + '%';
            fighter.style.transform = 'translateZ(40px)';
            playSound('say.wav');
          }, 800 + i * 600);

          // Поражение игрока
          setTimeout(() => {
            fighter.style.opacity = '0';
            fighter.style.transform = 'rotate(180deg) translateZ(-30px)';
            animationScene.appendChild(createExplosion(f.x + 15, 35));
            playSound('glitch.mp3');
          }, 4000 + i * 800);
        });

        // Пятый побеждает
        setTimeout(() => {
          pjaty.classList.add('ultimate');
          pjaty.style.left = '30%';
          pjaty.style.transform = 'translateZ(100px)';
          playSound('glitch.mp3');
        }, 6000);

        // Финальный взрыв
        setTimeout(() => {
          animationScene.appendChild(createExplosion(30, 20));
          animationScene.appendChild(createExplosion(50, 40));
          playSound('glitch.mp3');
        }, 8000);
      }

      window.closeAnimation = function() {
        animationOverlay.classList.remove('open');
        animationScene.innerHTML = '';
        animationActive = false;
      };

      // Секретные клавиши
      document.addEventListener('keydown', function(e) {
        if (animationActive) return;
        
        if (e.shiftKey && (e.key === 'X' || e.key === 'х')) {
          e.preventDefault();
          showKillAnimation();
        }
        
        if (e.shiftKey && (e.key === 'F' || e.key === 'а')) {
          e.preventDefault();
          showBattleAnimation();
        }

        if (e.key === 'Escape') {
          closeAnimation();
        }
      });

      setTimeout(() => {
        typewriter('Приветствую, странник. Я — Пятый, полубог симуляции Бренленда...', false, null);
      }, 1500);

      chatInput.focus();
    })();
  </script>
</body>
</html>
